<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Beta Tech Solutions</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <nav>
    <a href="../index.html">🏠 Home</a>
    <a href="login.html" class="active">Login</a>
    <a href="employee.html">Employee</a>
    <a href="product.html">Product</a>
    <a href="feedback.html">Feedback</a>
    <a href="booking.html">Booking</a>
     <a href="attendance.html" class="active">Attendance</a>
  </nav>

  <div class="card">
    <div class="card-header">
      <div class="badge">Developer 1 · feature/login-form</div>
      <h1>Welcome Back</h1>
      <p>Sign in to your Beta Tech account</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email"
               placeholder="you@example.com" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="Enter your password" required minlength="6" />
      </div>

      <button type="submit" class="btn">Sign In →</button>
    </form>

    <div class="toast" id="toast">✅ Login successful! Redirecting…</div>
  </div>

  <footer>Beta Tech Solutions · Login Form · Dev 1</footer>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      if (!this.checkValidity()) {
        this.reportValidity();
        return;
      }
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      this.reset();
      setTimeout(() => toast.classList.remove('show'), 3500);
    });
  </script>
</body>
</html>
