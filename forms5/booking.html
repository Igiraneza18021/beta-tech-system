<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Booking – Beta Tech Solutions</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <nav>
    <a href="../index.html">🏠 Home</a>
    <a href="login.html">Login</a>
    <a href="employee.html">Employee</a>
    <a href="product.html">Product</a>
    <a href="feedback.html">Feedback</a>
    <a href="booking.html" class="active">Booking</a>
     <a href="attendance.html" class="active">Attendance</a>
  </nav>

  <div class="card">
    <div class="card-header">
      <div class="badge">Developer 5 · feature/booking-form</div>
      <h1>Event Booking</h1>
      <p>Reserve your spot at a Beta Tech event</p>
    </div>

    <form id="bookingForm" novalidate>
      <div class="form-group">
        <label for="bkName">Full Name</label>
        <input type="text" id="bkName" name="name"
               placeholder="e.g. Claire Uwase" required />
      </div>

      <div class="form-group">
        <label for="bkEmail">Email Address</label>
        <input type="email" id="bkEmail" name="email"
               placeholder="claire@example.com" required />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="eventDate">Event Date</label>
          <input type="date" id="eventDate" name="date" required />
        </div>

        <div class="form-group">
          <label for="eventType">Event Type</label>
          <select id="eventType" name="eventType" required>
            <option value="" disabled selected>Select type</option>
            <option>Tech Conference</option>
            <option>Workshop</option>
            <option>Hackathon</option>
            <option>Networking Night</option>
            <option>Product Launch</option>
            <option>Webinar</option>
          </select>
        </div>
      </div>

      <button type="submit" class="btn">Book My Spot →</button>
    </form>

    <div class="toast" id="toast">✅ Booking confirmed! Check your email.</div>
  </div>

  <footer>Beta Tech Solutions · Booking Form · Dev 5</footer>

  <script>
    // Set min date to today
    document.getElementById('eventDate').min = new Date().toISOString().split('T')[0];

    document.getElementById('bookingForm').addEventListener('submit', function(e) {
      e.preventDefault();
      if (!this.checkValidity()) { this.reportValidity(); return; }
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      this.reset();
      setTimeout(() => toast.classList.remove('show'), 3500);
    });
  </script>
</body>
</html>
