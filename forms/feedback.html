<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Feedback – Beta Tech Solutions</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <nav>
    <a href="../index.html">🏠 Home</a>
    <a href="login.html">Login</a>
    <a href="employee.html">Employee</a>
    <a href="product.html">Product</a>
    <a href="feedback.html" class="active">Feedback</a>
    <a href="booking.html">Booking</a>
     <a href="attendance.html" class="active">Attendance</a>
  </nav>

  <div class="card">
    <div class="card-header">
      <div class="badge">Developer 4 · feature/feedback-form</div>
      <h1>Customer Feedback</h1>
      <p>Share your experience with Beta Tech Solutions</p>
    </div>

    <form id="feedbackForm" novalidate>
      <div class="form-group">
        <label for="fbName">Your Name</label>
        <input type="text" id="fbName" name="name"
               placeholder="e.g. Bob Mugisha" required />
      </div>

      <div class="form-group">
        <label for="fbEmail">Email Address</label>
        <input type="email" id="fbEmail" name="email"
               placeholder="bob@example.com" required />
      </div>

      <div class="form-group">
        <label for="message">Your Message</label>
        <textarea id="message" name="message"
                  placeholder="Tell us what you think…" required></textarea>
      </div>

      <div class="form-group">
        <label>Rating</label>
        <div class="rating-group">
          <input type="radio" id="r1" name="rating" value="1" required />
          <label for="r1">1</label>
          <input type="radio" id="r2" name="rating" value="2" />
          <label for="r2">2</label>
          <input type="radio" id="r3" name="rating" value="3" />
          <label for="r3">3</label>
          <input type="radio" id="r4" name="rating" value="4" />
          <label for="r4">4</label>
          <input type="radio" id="r5" name="rating" value="5" />
          <label for="r5">5</label>
        </div>
      </div>

      <button type="submit" class="btn">Submit Feedback →</button>
    </form>

    <div class="toast" id="toast">✅ Thank you for your feedback!</div>
  </div>

  <footer>Beta Tech Solutions · Feedback Form · Dev 4</footer>

  <script>
    document.getElementById('feedbackForm').addEventListener('submit', function(e) {
      e.preventDefault();
      if (!this.checkValidity()) { this.reportValidity(); return; }
      if (!document.querySelector('input[name="rating"]:checked')) {
        alert('Please select a rating.'); return;
      }
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      this.reset();
      setTimeout(() => toast.classList.remove('show'), 3500);
    });
  </script>
</body>
</html>
